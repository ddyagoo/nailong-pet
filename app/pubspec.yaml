name: nailong_pet
description: "奶龙桌宠 — 点一下听它播报今天，放久了它会笑。"
publish_to: 'none'
version: 0.2.1+3

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  lunar: ^1.7.8
  audioplayers: ^6.7.1
  shared_preferences: ^2.5.6
  http: ^1.6.0
  flutter_acrylic: ^1.1.4
  window_manager: ^0.5.2
  tray_manager: ^0.5.3
  url_launcher: ^6.3.3
  package_info_plus: ^10.2.2
  ffi: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/pet/
    - assets/audio/
    - assets/icons/

  fonts:
    - family: ZCOOL
      fonts:
        - asset: assets/fonts/ZCOOLKuaiLe-Regular.ttf
