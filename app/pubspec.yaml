name: nailong_pet
description: "奶龙桌宠 — 点一下听它播报今天，放久了它会笑。"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  lunar: ^1.7.8
  audioplayers: ^6.7.1
  shared_preferences: ^2.5.6
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/pet/
    - assets/audio/

  fonts:
    - family: ZCOOL
      fonts:
        - asset: assets/fonts/ZCOOLKuaiLe-Regular.ttf
